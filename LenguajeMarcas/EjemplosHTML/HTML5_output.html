<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>LM</title>
    </head>
    <body>
        <h1>Longitud de la circunferencia</h1>
        <h3>Mueva el indicador para conocer cómo varía la longitud de la circunferencia con respecto al radio</h3>
        <form oninput="x.value=parseInt(a.value * 2 * 3.1415);z.value=parseInt(a.value)">
            Longitud del radio:
            0 <input type="range" id="a" name="a" value="0"> 100
            <br><br>
            Valor del radio: <output name="z" for="a"> </output>
            <br><br>
            Longitud de la cirucunferencia: <output name="x" for="a"> </output>
        </form>
    </body>
</html>
